name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name ClaudeUsage claude_usage_tray.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeUsage.exe
